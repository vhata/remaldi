[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "remaldi"
version = "0.1.0"
description = "Local Vivaldi control client and on-demand daemon"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["websockets>=15,<18"]

[project.optional-dependencies]
dev = ["ruff==0.16.10", "mypy==2.4.0", "pre-commit==4.6.2", "build==1.6.1", "detect-secrets==1.5.0"]

[project.scripts]
remaldi = "remaldi.__main__:main"

[tool.setuptools.packages.find]
include = ["remaldi*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-include = ["bin/remaldi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"bin/remaldi" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["remaldi"]
strict = true
