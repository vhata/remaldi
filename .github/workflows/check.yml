name: Checks
on:
  push:
    branches: [main]
  pull_request:
  # Revalidate queue markers when a PR description changes.
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: scripts/check.sh
      - run: python -m build
      - name: Validate PR claims
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          Path(os.environ["RUNNER_TEMP"], "pr-body.md").write_text(event["pull_request"]["body"] or "")
          PYCODE
          bash scripts/workflow/check-pr-markers.sh --body "$RUNNER_TEMP/pr-body.md" --base "origin/$BASE_REF" --head HEAD --branch "$HEAD_BRANCH"
