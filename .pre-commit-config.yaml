# Every hook runs a tool from the locked dev dependency group through uv, so
# uv.lock is the only place tool versions are pinned. Install with
# scripts/setup.sh.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and fixes
        entry: uv run --locked ruff check --fix --force-exclude
        language: unsupported
        types_or: [python]
        require_serial: true
        stages: [pre-commit]
      - id: ruff-format
        name: Ruff formatting
        entry: uv run --locked ruff format --force-exclude
        language: unsupported
        types_or: [python]
        require_serial: true
        stages: [pre-commit]
      - id: shfmt
        name: Shell formatting
        entry: uv run --locked shfmt --write
        language: unsupported
        files: ^scripts/.*\.sh$
        stages: [pre-commit]
      - id: shellcheck
        name: Shell lint
        entry: uv run --locked shellcheck
        language: unsupported
        files: ^scripts/.*\.sh$
        stages: [pre-commit]
      - id: workflow-lint
        name: GitHub Actions lint and security audit
        entry: bash -c 'uv run --locked actionlint && uv run --locked zizmor --offline .github/workflows'
        language: unsupported
        files: ^\.github/workflows/
        pass_filenames: false
        stages: [pre-commit]
      - id: typos
        name: Spelling
        entry: uv run --locked typos --force-exclude
        language: unsupported
        types: [text]
        require_serial: true
        stages: [pre-commit]
      - id: trailing-whitespace
        name: Trailing whitespace
        entry: uv run --locked trailing-whitespace-fixer
        language: unsupported
        types: [text]
        exclude: ^docket/
        stages: [pre-commit]
      - id: end-of-file
        name: Final newline
        entry: uv run --locked end-of-file-fixer
        language: unsupported
        types: [text]
        exclude: ^docket/
        stages: [pre-commit]
      - id: check-toml
        name: TOML syntax
        entry: uv run --locked check-toml
        language: unsupported
        types: [toml]
        stages: [pre-commit]
      - id: check-yaml
        name: YAML syntax
        entry: uv run --locked check-yaml
        language: unsupported
        types: [yaml]
        stages: [pre-commit]
      - id: check-merge-conflict
        name: Merge conflict markers
        entry: uv run --locked check-merge-conflict
        language: unsupported
        types: [text]
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        name: Executables have shebangs
        entry: uv run --locked check-executables-have-shebangs
        language: unsupported
        types: [text, executable]
        exclude: ^docket/
        stages: [pre-commit]
      - id: check-shebang-scripts-are-executable
        name: Shebang scripts are executable
        entry: uv run --locked check-shebang-scripts-are-executable
        language: unsupported
        types: [text]
        exclude: ^docket/
        stages: [pre-commit]
      - id: large-files
        name: Large files
        entry: uv run --locked check-added-large-files
        language: unsupported
        stages: [pre-commit]
      - id: lockfile
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: unsupported
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        stages: [pre-commit]
      - id: secret-audit
        name: Secret audit of files and reachable history
        entry: uv run --locked python scripts/audit-secrets.py
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: workflow-records
        name: Workflow queues and documentation links
        entry: bash -c 'bash docket/scripts/check-queues.sh --strict && bash docket/scripts/check-links.sh'
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: quality-checks
        name: Complete gate (scripts/check.sh)
        entry: bash scripts/check.sh
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
